[package]
name = "multicad-kernel"
description = "MultiCAD geometry providers and shared modeling API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
multicad-precision.workspace = true
multicad-core.workspace = true
multicad-rust-kernel.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "=1.0.154"

# Geometry and transfer data use safe Rust.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
