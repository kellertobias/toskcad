[package]
name = "multicad-ui"
description = "Native application host; domain workspaces register separately"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Native comparison fixtures opt in explicitly. Rust-only workspace tests must
# not regain OpenCascade through this crate's development dependencies.

[dependencies]
multicad-precision.workspace = true
eframe.workspace = true
multicad-core.workspace = true
multicad-solver.workspace = true
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
png = "=0.18.1"
# egui-wgpu's defaults without `macos-window-resize-jitter-fix` (CAD-420): it
# presents inside Core Animation transactions during resize, and a frame drawn
# inside that commit can wait the full 1 s `nextDrawable` timeout. Versions
# match eframe's exact pins; `wgpu` keeps its default native backends.
egui-wgpu = { version = "=0.36.2", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = "=30.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
cxx = "=1.0.205"
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winit = { version = "=0.30.13", default-features = false }

[build-dependencies]
cxx-build = "=1.0.205"

[dev-dependencies]
tempfile = "=3.27.0"
multicad-model.workspace = true
multicad-kernel.workspace = true
naga = { version = "=30.0.1", features = ["wgsl-in"] }

# Only the small audited native-window bridge may declare unsafe FFI.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"
