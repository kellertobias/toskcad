name: Native regression suites

# Read-only build/test evidence on three operating systems. No publication,
# credentials, tags or tracked-file changes. Named suites identify failures in
# file recovery, cancellation, exporters and other areas. Run it by hand when a
# failure needs a named suite. Publication is gated by the partitioned
# complete-workspace archive runs in release.yml, which run every test these
# suites run; logs and headless budget reports are kept.
on:
  workflow_call:
    inputs:
      packaging_runs_full_workspace:
        description: The caller separately gates every platform on the complete workspace suite
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Native regression / ${{ matrix.target }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      # Every suite runs on every platform. The serial suites exceeded one
      # job limit, so each platform runs three suite groups in parallel.
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            group: kernel
            timeout_minutes: 120
          - os: ubuntu-24.04
            target: linux-x64
            group: files
            timeout_minutes: 120
          - os: ubuntu-24.04
            target: linux-x64
            group: interface
            timeout_minutes: 120
          - os: macos-15
            target: macos-arm64
            group: kernel
            timeout_minutes: 120
          - os: macos-15
            target: macos-arm64
            group: files
            timeout_minutes: 120
          - os: macos-15
            target: macos-arm64
            group: interface
            timeout_minutes: 120
          - os: windows-2025
            target: windows-x64
            group: kernel
            timeout_minutes: 180
          - os: windows-2025
            target: windows-x64
            group: files
            timeout_minutes: 180
          - os: windows-2025
            target: windows-x64
            group: interface
            timeout_minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      # Dev debug info for every workspace target exhausted the macOS runner
      # disk while linking, even as line tables only. Test behaviour does not
      # depend on it; backtraces keep function names.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Unoptimised exact geometry and its dependencies did not finish the
      # named suites within the job limit. Optimise every crate while keeping
      # the dev profile's debug assertions and overflow checks.
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Free macOS runner disk
        # Every workspace target plus the per-package test builds exceed the
        # image's free space. Remove SDKs this job never uses; keep the
        # selected Xcode.
        if: runner.os == 'macOS'
        run: |
          df -h .
          active="$(realpath "$(xcode-select -p)/../..")"
          case "$active" in
            /Applications/Xcode*.app)
              for x in /Applications/Xcode*.app; do
                [ -L "$x" ] && continue
                [ "$(realpath "$x")" = "$active" ] || sudo rm -rf "$x"
              done ;;
            *) echo "Selected developer directory is not an Xcode app; keeping every Xcode." ;;
          esac
          sudo rm -rf "$HOME/Library/Android" "$HOME/.dotnet" /usr/local/share/dotnet
          df -h .
      - run: rustup show active-toolchain
      - name: Install pinned cargo-nextest
        run: cargo install cargo-nextest --version 0.9.152 --locked
      - name: Owned Rust kernel
        if: matrix.group == 'kernel'
        run: cargo nextest run --locked -p multicad-precision -p multicad-rust-kernel
      - name: Linux native window development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Build every workspace target
        if: matrix.group == 'files'
        run: cargo build --workspace --all-targets --locked && df -h .
      - name: Canonical KiCad model path resolution
        if: matrix.group == 'files'
        run: cargo nextest run -p multicad-model --lib --locked forward_slash_models_resolve_beside_a_canonical_board_directory
      - name: Project file round trip, recovery, compatibility and damage (scenario projects)
        if: matrix.group == 'files'
        run: "cargo nextest run -p multicad-app --locked --no-fail-fast --bin multicad files::"
      - name: Project container codec and recovery identity
        if: matrix.group == 'files'
        run: cargo nextest run -p multicad-core --locked --no-fail-fast --test project_file
      - name: Cancellation, runtime supersession and incremental status
        if: matrix.group == 'files'
        run: cargo nextest run -p multicad-app --locked --no-fail-fast --test release_hardening
      - name: Model runtime and geometry worker cancellation
        if: matrix.group == 'kernel'
        run: >-
          cargo nextest run --locked --no-fail-fast
          -p multicad-model --test runtime --test drawing_concurrency
          -p multicad-kernel --test worker --test advanced_concurrency
      - name: Geometry validity (native kernel)
        if: matrix.group == 'kernel'
        run: cargo nextest run -p multicad-kernel --locked --no-fail-fast
      - name: Exporter validation
        if: matrix.group == 'files'
        run: >-
          cargo nextest run -p multicad-model --locked --no-fail-fast
          --test drawing_exports --test mesh_exports --test export_sets
          --test assembly_exports --test sheet_dxf --test planar_dxf
          --test render_handoff
      - name: Acceptance scenarios (makerspace, cabinetry/table, tool case, control desk)
        if: matrix.group == 'files'
        run: >-
          cargo nextest run -p multicad-app --locked --no-fail-fast
          --test makerspace --test cabinetry_table --test tool_case --test control_desk
      - name: UI workflow state and MCP tools
        if: matrix.group == 'interface'
        run: cargo nextest run --locked --no-fail-fast -p multicad-ui -p multicad-mcp
      - name: Application CLI, MCP server and shared workflow
        if: matrix.group == 'interface'
        run: >-
          cargo nextest run -p multicad-app --locked --no-fail-fast
          --test mcp --test cli --test shared_workflow
      - name: Complete workspace tests
        if: ${{ matrix.group == 'files' && (!inputs.packaging_runs_full_workspace) }}
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Headless budget smoke (dev profile, one run; not a performance result)
        if: ${{ matrix.group == 'files' && (success() || failure()) }}
        run: node tools/release-budgets.mjs --profile dev --repeat 1 --label ci-${{ matrix.target }}
      - name: Keep budget reports and generated scenario deliverables
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-regression-${{ matrix.target }}-${{ matrix.group }}-${{ github.sha }}
          path: artifacts/benchmarks/
          if-no-files-found: warn
          retention-days: 7
