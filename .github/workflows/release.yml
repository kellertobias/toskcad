name: CI and release

# GitHub owns branches and tag-only releases on the exact tested commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multicad-ci-${{ github.ref }}
  # Never interrupt an active main release halfway through tag/asset publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  owned-kernel:
    name: Owned Rust kernel proof
    uses: ./.github/workflows/owned-kernel.yml

  metadata:
    name: Select build/release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preview semantic version without remote writes
        id: version
        run: node tools/select-version.mjs

  quality:
    name: Formatting, Clippy and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm test
      - run: node mockup/verify.mjs

  test_archive:
    # Compile every workspace test once per platform. The archive runs on
    # several runners below; doctests and the headless budget smoke reuse
    # the same compiled dependencies here.
    name: Compile tests / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            timeout_minutes: 150
          - os: macos-15
            target: macos-arm64
            timeout_minutes: 150
          - os: windows-2025
            target: windows-x64
            timeout_minutes: 240
    env:
      MULTICAD_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      MULTICAD_BUILD_COMMIT: ${{ github.sha }}
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.152
      - name: Linux native window development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Compile every workspace test into one archive
        run: node tools/native-test-shard.mjs archive "nextest-${{ matrix.target }}.tar.zst"
      - name: Doctests
        run: cargo test --workspace --doc --profile ci --locked
      - name: Headless budget smoke (ci profile, one run; not a performance result)
        run: node tools/release-budgets.mjs --profile ci --repeat 1 --label ci-${{ matrix.target }}
      - name: Keep budget reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/benchmarks/
          if-no-files-found: warn
          retention-days: 7
      - name: Share the compiled test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-${{ matrix.target }}-${{ github.sha }}
          path: nextest-${{ matrix.target }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test:
    # Each runner runs one disjoint hash partition of the platform archive;
    # together the partitions run every workspace test exactly once.
    name: Test / ${{ matrix.target }} / ${{ matrix.partition }}
    needs: test_archive
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, macos-arm64, windows-x64]
        partition: [1, 2, 3, 4]
        include:
          - target: linux-x64
            os: ubuntu-24.04
            timeout_minutes: 90
          - target: macos-arm64
            os: macos-15
            timeout_minutes: 90
          - target: windows-x64
            os: windows-2025
            timeout_minutes: 150
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: rustup show active-toolchain
      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.152
      - name: Linux native window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-${{ matrix.target }}-${{ github.sha }}
      - name: Run test partition ${{ matrix.partition }}
        run: node tools/native-test-shard.mjs shard "nextest-${{ matrix.target }}.tar.zst" ${{ matrix.partition }}

  package:
    # Builds, smoke-checks and archives the shipped executable. The test jobs
    # above gate publication for the same commit.
    name: Build and package / ${{ matrix.target }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            timeout_minutes: 120
          - os: macos-15
            target: macos-arm64
            timeout_minutes: 120
          - os: windows-2025
            target: windows-x64
            timeout_minutes: 180
    env:
      MULTICAD_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      MULTICAD_PACKAGE_TESTS: gated
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux native window development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Build, smoke-check and archive the exact version
        run: node tools/package-release.mjs build "$MULTICAD_RELEASE_VERSION"
      - name: Preserve verified platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Mint GitHub tag and hosted release
    needs: [metadata, quality, package, test, owned-kernel]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.metadata.outputs.release == 'true' &&
      vars.MULTICAD_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: multicad-semantic-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-${{ github.sha }}
          path: artifacts/release
          merge-multiple: true
      - name: Verify every archive, identity and checksum
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node tools/package-release.mjs verify "$VERSION" "$GITHUB_SHA"
      - name: Create tag-only release on the tested commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          MULTICAD_RELEASES_ENABLED: ${{ vars.MULTICAD_RELEASES_ENABLED }}
          MULTICAD_EXPECTED_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: npm run release
      - name: Verify the tag and unchanged tracked files
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(git rev-parse "v$VERSION^{commit}")" = "$GITHUB_SHA"
          git diff --exit-code
