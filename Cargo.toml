[workspace]
members = ["crates/multicad-core", "crates/multicad-app", "crates/multicad-kernel", "crates/multicad-precision", "crates/multicad-rust-kernel", "crates/multicad-solver", "crates/multicad-model", "crates/multicad-ui", "crates/multicad-mcp"]
default-members = ["crates/multicad-app"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
multicad-core = { path = "crates/multicad-core" }
multicad-kernel = { path = "crates/multicad-kernel", default-features = false }
multicad-rust-kernel = { path = "crates/multicad-rust-kernel" }
multicad-precision = { path = "crates/multicad-precision" }
multicad-solver = { path = "crates/multicad-solver" }
multicad-model = { path = "crates/multicad-model", default-features = false }
multicad-ui = { path = "crates/multicad-ui" }
multicad-mcp = { path = "crates/multicad-mcp", default-features = false }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Exact geometry and bigint arithmetic are also hot paths in the application
# opened by ./build. Keep them optimized while the UI retains its dev profile.
[profile.dev.package.multicad-rust-kernel]
opt-level = 2

[profile.dev.package.multicad-kernel]
opt-level = 2

[profile.dev.package.multicad-precision]
opt-level = 2

[profile.dev.package.multicad-model]
opt-level = 2

[profile.dev.package.num-bigint]
opt-level = 2

# Preserve owned-code line mappings without slowing dependency arithmetic.
# Run cargo llvm-cov with --profile coverage and without global opt-level flags.
[profile.coverage]
inherits = "dev"
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false

[profile.coverage.package.multicad-rust-kernel]
opt-level = 0

[profile.coverage.package.multicad-precision]
opt-level = 0

[profile.coverage.package.multicad-kernel]
opt-level = 0

[profile.coverage.package.num-bigint]
opt-level = 2
# Native example regeneration is expensive without Rust optimization.
# Keep development assertions while avoiding release LTO for test binaries.
[profile.ci]
inherits = "dev"
opt-level = 2
debug = 0
debug-assertions = true
overflow-checks = true
codegen-units = 16
incremental = false
